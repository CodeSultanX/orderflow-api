[program:orderflow-worker]
command=/usr/bin/php /var/www/orderflow-api/artisan queue:work --sleep=3 --tries=3 --timeout=60
directory=/var/www/orderflow-api
user=www-data
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/orderflow-api/storage/logs/worker.log
stopwaitsecs=120